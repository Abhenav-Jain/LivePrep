services:
  - type: web
    name: liveprep-multimodal-agent
    env: docker
    plan: standard
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Text model for post-session reports (for example gemini-2.5-flash).
      - key: REPORT_MODEL
        sync: false
      - key: MAX_CONCURRENT_SESSIONS
        value: "3"
      # Practice minutes per user per UTC day (0 disables the limit).
      - key: DAILY_MINUTES_LIMIT
        value: "30"
      - key: MAX_CONCURRENT_REPORT_JOBS
        value: "2"
      - key: PORT
        value: 8000
      # Public browser settings for login (baked into the frontend at build time).
      # The publishable key is meant to be public; never put a secret/service_role key here.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
