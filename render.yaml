services:
  - type: web
    name: liveprep-multimodal-agent
    env: docker
    plan: standard
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LIVEPREP_TOKEN
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAX_CONCURRENT_SESSIONS
        value: "3"
      - key: PORT
        value: 8000
