services:
  liveprep:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-3}
      - DAILY_MINUTES_LIMIT=${DAILY_MINUTES_LIMIT:-30}
      - WEEKLY_SESSION_GOAL=${WEEKLY_SESSION_GOAL:-5}
      - APP_VERSION=${APP_VERSION:-2.0.0}
      - MAX_CONCURRENT_REPORT_JOBS=${MAX_CONCURRENT_REPORT_JOBS:-2}
      - REPORT_RETRY_LIMIT=${REPORT_RETRY_LIMIT:-10}
      - REPORT_RETRY_WINDOW_SECONDS=${REPORT_RETRY_WINDOW_SECONDS:-3600}
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_JWT_AUDIENCE=${SUPABASE_JWT_AUDIENCE:-authenticated}
      - REPORT_MODEL=${REPORT_MODEL:-}
      - REPORT_AUTO_GENERATE=${REPORT_AUTO_GENERATE:-1}
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
